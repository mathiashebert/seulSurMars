<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une Maison sur la Lune</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        h1 {
            text-align: center;
            color: #90ee90;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(6, 80px);
            grid-template-rows: repeat(6, 80px);
            gap: 5px;
            margin: 1rem auto;
        }

        .adventure-pannel {
            display: grid;
            grid-template-columns: repeat(6, 80px);
            gap: 5px;
            margin: 1rem auto;
        }
        .construction-deck {
            display: none;
            grid-template-columns: repeat(6, 80px);
            gap: 5px;
            margin: 1rem auto;
        }
        .construction-deck.calling {
            display: grid;
        }
        .construction-deck.calling :not(.used){
            opacity: 1;
        }
        .construction-deck.calling .used{
            opacity: 0.3;
        }


        .adventure-pannel-item  {
            width: 80px;
            height: 80px;
            background: #222;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
        }
        .adventure-pannel-item.alien-pannel {
            background-size: contain;
            background-image: url("./img-moon/alien_attack.png");
        }

        .card.cell.construction:not(.occupied) {
            color: #333;
        }
        .cell {
            width: 80px;
            height: 80px;
            background: #222;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .possible-target {
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.5);
        }
        .controls {
            margin-top: 1rem;
        }
        button {
            background: #444;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            margin: 0.3rem;
            cursor: pointer;
        }
        button:hover {
            background: #666;
        }
        .log {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #666;
            background: #1a1a1a;
            padding: 0.5rem;
            width: 90%;
            margin-top: 1rem;
            display: none;
        }
        .astronaut {
            display: block;
            border: 1px solid;
            width: 40px;
            height: 40px;
            position: absolute;
            top: 20px;
            left: 20px;
            background-size: contain;
            background-image: url("./img-moon/astro.png");
        }
        .astronaut.sick {
            background-image: url("./img-moon/astro_sick.png");
        }
        .astronaut.sick.verySick {
            background-image: url("./img-moon/astro_very_sick.png");
        }
        .astronaut.construction {
            width: 80px;
            height: 80px;
            top: 0px;
            left: 0px;
        }

        .cell {
            background-size: contain;
            position: relative;
        }
        .cell:not(.built) {
            opacity: 0.7;
        }
        .cell.communication {
            border-color:  #EEE;
        }
        .built.hearts {
            background-image: url("./img-moon/hearts_inactive.png");
        }
        .built.hearts.active {
            background-image: url("./img-moon/hearts_active.png");
        }
        .construction.hearts {
            background-image: url("./img-moon/hearts_construction.png");
        }
        .built.hearts.hearts2 {
            background-image: url("./img-moon/hearts2_inactive.png");
        }
        .built.hearts.hearts2.active {
            background-image: url("./img-moon/hearts2_active.png");
        }
        .built.clubs {
            background-image: url("./img-moon/clubs_inactive.png");
        }
        .built.clubs.active {
            background-image: url("./img-moon/clubs_active.png");
        }
        .construction.clubs {
            background-image: url("./img-moon/clubs_construction.png");
        }
        .cell.clubs.jungle {
            background-image: url("./img-moon/jungle.png");
        }
        .cell.clubs.active.mutation {
            background-image: url("./img-moon/mutation.png");
        }
        .cell.exploded {
            background-image: url("./img-moon/exploded.png");
        }
        .built.spades {
            background-image: url("./img-moon/spades_inactive.png");
        }
        .built.spades.active {
            background-image: url("./img-moon/spades_active.png");
        }
        .construction.spades {
            background-image: url("./img-moon/spades_construction.png");
        }
        .built.diamonds {
            background-image: url("./img-moon/diamonds_inactive.png");
        }
        .built.diamonds.active {
            background-image: url("./img-moon/diamonds_active.png");
        }
        .construction.diamonds {
            background-image: url("./img-moon/diamonds_construction.png");
        }
        .spades.bunker {
            background-image: url("./img-moon/bunker.png");
        }

        .cell.alien {
            background-image: url("./img-moon/alien_attack.png") !important;

        }

        .construction.supply {
            background-image: url("./img-moon/supply.png");
        }

        .capsule {
            position: absolute;
            width: 80px;
            height: 80px;
            animation: descend 2s ease-in forwards;
            pointer-events: none; /* pour ne pas gêner */
            background-size: contain;
        }
        .capsule.rocket {
            background-image: url("./img-moon/landing.png");
        }
        .capsule.alien {
            background-image: url("./img-moon/alien_attack.png");
        }

        @keyframes descend {
            0% {
                transform: translateY(-200px) scale(1);
                opacity: 0;
            }
            10% {
                transform: translateY(-200px) scale(1);
                opacity: 1;
            }
            70% {
                transform: translateY(var(--targetY)) scale(1);
                opacity: 1;
            }
            80% {
                transform: translateY(var(--targetY)) scale(1.2); /* effet pop */
            }
            90% {
                transform: translateY(var(--targetY)) scale(1);
            }
            100% {
                transform: translateY(var(--targetY)) scale(0.25);
                opacity: 0;
            }
        }

        .resource-token {
            position: absolute;
            width: 40px;
            height: 20px;
            bottom: 0;
            text-align: center;
        }
        .resource-token-food {
            left: 0;
            background: #109010;
        }
        .resource-token-energy {
            right: 0;
            background: #901010;
        }

        .astronaut .resource-token {
            width: 15px;
            height: 15px;
            font-size: 1rem;
            opacity: 1;
        }

        .action-token {
            position: absolute;
            width: 20px;
            height: 20px;
            top: 0;
            left: 0;
            text-align: center;
            background: #333333;
            font-size: 1rem;

        }
        .alien-signal-icon {
            left: 60px;
        }
        .alien-group-icon {
            left: 20px;
            width: 40px;
        }

        .status-token {
            position: absolute;
            width: 20px;
            height: 20px;
            text-align: center;
            background: #333333;
            font-size: 1rem;
        }
        .plant-mutation-icon {
            left: 0;
            top: 20px;
        }
        .smoke-icon {
            left: 0;
            top: 40px;
        }
        .mortuary-icon {
            right: 0;
            top: 20px;
        }
        .biohazard-icon {
            right: 0;
            top: 20px;
        }
    </style>
</head>
<body>
<h1>Une Maison sur la Lune</h1>
<div class="board" id="board"></div>
<div class="construction-deck" id="construction-deck"></div>
<div class="adventure-pannel" id="adventure-pannel">
    <div class="adventure-pannel-item alien-pannel"></div>
</div>
<div class="controls">
    <button onclick="nextTurn()">Tour Suivant</button>
    <button onclick="resetGame()">Réinitialiser</button>
</div>
<div class="log" id="log"></div>

<script>
    const logPanel = document.getElementById('log');
    const boardSize = 6;
    const discardSize = 6;
    const cards = [];
    const specialPositions = {
        '♥': [2, 2],
        '♣': [2, 3],
        '♦': [3, 2],
        '♠': [3, 3],
    };

</script>
<script src="index.js"></script>

</body>
</html>
