<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une Maison sur la Lune</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        h1 {
            text-align: center;
            color: #90ee90;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(6, 80px);
            grid-template-rows: repeat(6, 80px);
            gap: 5px;
            margin: 1rem auto;
        }

        .construction-deck {
            display: grid;
            grid-template-columns: repeat(6, 80px);
            gap: 5px;
            margin: 1rem auto;
        }

        .card.cell.construction:not(.occupied) {
            color: #333;
        }
        .cell {
            width: 80px;
            height: 80px;
            background: #222;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .possible-target {
            border-color: white;
        }
        .controls {
            margin-top: 1rem;
        }
        button {
            background: #444;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            margin: 0.3rem;
            cursor: pointer;
        }
        button:hover {
            background: #666;
        }
        .log {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #666;
            background: #1a1a1a;
            padding: 0.5rem;
            width: 90%;
            margin-top: 1rem;
        }
        .astronaut {
            display: block;
            border: 1px solid;
            background: #333;
        }

        .cell {
            background-size: contain;
        }
        .built.hearts {
            background-image: url("./img-moon/hearts_inactive.png");
        }
        .built.hearts.active {
            background-image: url("./img-moon/hearts_active.png");
        }
        .construction.hearts {
            background-image: url("./img-moon/hearts_construction.png");
        }
        .built.hearts.hearts2 {
            background-image: url("./img-moon/hearts2_inactive.png");
        }
        .built.hearts.hearts2.active {
            background-image: url("./img-moon/hearts2_active.png");
        }
        .built.clubs {
            background-image: url("./img-moon/clubs_inactive.png");
        }
        .built.clubs.active {
            background-image: url("./img-moon/clubs_active.png");
        }
        .construction.clubs {
            background-image: url("./img-moon/clubs_construction.png");
        }
        .built.clubs.jungle {
            background-image: url("./img-moon/jungle.png");
        }
        .built.spades {
            background-image: url("./img-moon/spades_inactive.png");
        }
        .built.spades.active {
            background-image: url("./img-moon/spades_active.png");
        }
        .construction.spades {
            background-image: url("./img-moon/spades_construction.png");
        }
        .built.diamonds {
            background-image: url("./img-moon/diamonds_inactive.png");
        }
        .built.diamonds.active {
            background-image: url("./img-moon/diamonds_active.png");
        }
        .construction.diamonds {
            background-image: url("./img-moon/diamonds_construction.png");
        }
        .spades.bunker {
            background-image: url("./img-moon/bunker.png");
        }
    </style>
</head>
<body>
<h1>Une Maison sur la Lune</h1>
<div class="board" id="board"></div>
<p>defausse</p>
<div class="construction-deck" id="construction-deck"></div>
<div class="controls">
    <button onclick="nextTurn()">Tour Suivant</button>
    <button onclick="resetGame()">Réinitialiser</button>
</div>
<div class="log" id="log"></div>

<script>
    const logPanel = document.getElementById('log');
    const boardSize = 6;
    const discardSize = 6;
    const cards = [];
    const specialPositions = {
        '♥': [2, 2],
        '♣': [2, 3],
        '♦': [3, 2],
        '♠': [3, 3],
    };

</script>
<script src="index.js"></script>

</body>
</html>
