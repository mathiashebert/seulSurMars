<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une Maison sur la Lune</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        h1 {
            text-align: center;
            color: #90ee90;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(6, 80px);
            grid-template-rows: repeat(6, 80px);
            gap: 5px;
            margin: 1rem auto;
        }
        .cell {
            width: 80px;
            height: 80px;
            background: #333;
            border: 1px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .possible-target {
            border-color: white;
        }
        .controls {
            margin-top: 1rem;
        }
        button {
            background: #444;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            margin: 0.3rem;
            cursor: pointer;
        }
        button:hover {
            background: #666;
        }
        .log {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #666;
            background: #1a1a1a;
            padding: 0.5rem;
            width: 90%;
            margin-top: 1rem;
        }
        .astronaut {
            display: block;
            border: 1px solid;
        }
    </style>
</head>
<body>
<h1>Une Maison sur la Lune</h1>
<div class="board" id="board"></div>
<div class="controls">
    <button onclick="nextTurn()">Tour Suivant</button>
    <button onclick="resetGame()">Réinitialiser</button>
</div>
<div class="log" id="log"></div>

<script>
    const board = document.getElementById('board');
    const logPanel = document.getElementById('log');
    const boardSize = 6;
    const cards = [];
    const specialPositions = {
        '♥': [2, 2],
        '♣': [2, 3],
        '♦': [3, 2],
        '♠': [3, 3],
    };

    function createBoard() {
        board.innerHTML = '';
        for (let y = 0; y < boardSize; y++) {
            for (let x = 0; x < boardSize; x++) {
                const div = document.createElement('div');
                div.classList.add('card');
                div.dataset.x = x;
                div.dataset.y = y;
                const special = Object.entries(specialPositions).find(([_, pos]) => pos[0] === y && pos[1] === x);
                div.textContent = special ? special[0] : '';
                board.appendChild(div);
            }
        }
    }

    function logMessage(msg) {
        const p = document.createElement('p');
        p.textContent = msg;
        logPanel.appendChild(p);
        logPanel.scrollTop = logPanel.scrollHeight;
    }

    function nextTurn() {
        logMessage("Début d'un nouveau tour...");
        // Logique de ressources, péripéties, actions à implémenter ici
        runResourcePhase();
    }

    function resetGame() {
        logPanel.innerHTML = '';
        logMessage("Partie réinitialisée.");
        initializeGame();
    }

    createBoard();
    logMessage("Bienvenue sur la Lune !");
</script>
<script src="index.js"></script>

</body>
</html>
